name: Verify website and acquisition flow
on:
  pull_request:
  push:
    branches: [main, codex/acquisition-code-review]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: wellspring_tests
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only@localhost:5432/wellspring_tests
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:marketing
      - run: npm test
      - name: Check generated pages are current
        run: git diff --exit-code -- public marketing/manifest.js
